<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algorithm Explorer — social card</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 1200px; height: 630px; overflow: hidden;
      background:
        radial-gradient(circle at 12% -10%, rgba(29,123,255,.4), transparent 45%),
        radial-gradient(circle at 95% 8%, rgba(122,240,199,.16), transparent 40%),
        radial-gradient(circle at 50% 120%, rgba(199,166,255,.2), transparent 46%),
        #050912;
      color: #e9f4ff;
      font-family: "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      display: grid; grid-template-columns: 1fr 600px; gap: 28px; padding: 54px 56px;
    }
    .left { display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { font-size: 13px; letter-spacing: .22em; text-transform: uppercase; color: #57d7ff; font-weight: 800; }
    h1 { font-size: 70px; line-height: .98; letter-spacing: -.045em; margin: 18px 0 16px; }
    h1 span { color: #57d7ff; }
    p { font-size: 20px; line-height: 1.5; color: #9fb8d4; max-width: 470px; margin: 0 0 30px; }
    .stats { display: flex; gap: 14px; }
    .stats div { border: 1px solid rgba(126,173,255,.25); background: rgba(11,21,38,.7); border-radius: 12px; padding: 12px 16px; }
    .stats b { display: block; font-family: monospace; font-size: 24px; color: #7af0c7; }
    .stats span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #67809e; }
    .right { position: relative; display: grid; place-items: center; }
    .frame { width: 600px; height: 375px; border-radius: 18px; overflow: hidden; border: 1px solid rgba(126,173,255,.3); box-shadow: 0 40px 120px rgba(0,0,0,.55); transform: rotate(-1.4deg); background: #040a14; }
    .frame img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; }
    .badge { position: absolute; bottom: 24px; right: 10px; background: #0b1628; border: 1px solid rgba(87,215,255,.4); border-radius: 999px; padding: 8px 14px; font-size: 12px; color: #bdefff; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .mark { width: 34px; height: 34px; border-radius: 10px; background: radial-gradient(circle at 30% 25%, rgba(87,215,255,.4), rgba(9,22,40,.9) 62%); border: 1px solid rgba(87,215,255,.45); }
    .brand span { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: #8ea6c4; }
  </style>
</head>
<body>
  <div class="left">
    <div class="brand"><i class="mark"></i><span>Algorithm Explorer</span></div>
    <div class="eyebrow">Top 15 SWE interview patterns</div>
    <h1>See the pattern.<br><span>Step the algorithm.</span></h1>
    <p>Fifteen interactive 3D traces with synchronized code, a recognition quiz and a persistent practice tracker.</p>
    <div class="stats">
      <div><b>15</b><span>patterns</span></div>
      <div><b>61</b><span>problems</span></div>
      <div><b>30</b><span>quiz prompts</span></div>
    </div>
  </div>
  <div class="right">
    <div class="frame"><img src="studio.png" alt="Algorithm Explorer studio"></div>
    <div class="badge">somphol.github.io/algorithm-explorer</div>
  </div>
</body>
</html>
